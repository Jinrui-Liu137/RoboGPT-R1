### model
model_name_or_path: /workspace/HFD/Qwen2.5-VL-3B-Instruct
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true 
freeze_multi_modal_projector: true  
freeze_language_model: false  
deepspeed: /workspace/Codes/LLaMA-Factory/examples/deepspeed/ds_z3_config.json

### ddp
ddp_timeout: 180000000


### dataset
dataset_dir: /workspace/Codes/RoboGPT-R1/dataset_JSON
dataset: alfPlan-0_shot
media_dir: /workspace/Datasets/alfPlan/medias
template: qwen2_vl 
cutoff_len: 9018
max_samples: 10000
overwrite_cache: true
preprocessing_num_workers: 64
dataloader_num_workers: 8

### output
output_dir: /workspace/Experients/RoboGPT-R1/exp0--only_sft/weight1
logging_steps: 10
save_steps: 100                 # 要是eval_steps的整数倍
load_best_model_at_end: true    # load the best model when training ends
# save_total_limit: 1           # only keep one checkpoint(if not the best) in the output directory
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.00001

num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
resume_from_checkpoint: null

### eval
val_size: 0.05
per_device_eval_batch_size: 1
eval_accumulation_steps: 1
eval_strategy: steps
eval_steps: 50


### vocab 
# split_special_tokens: false
# resize_vocab: true 
# skip_special_tokens: false
# use_fast_tokenizer: true
